# olas-win.conf — OLAS Windows runtime tuning.
#
# Optional. Delete it and the built-in defaults apply. Override the location
# with OLAS_CONFIG=C:\path or olas_win.exe -c C:\path.
#
# Bad values and unknown keys warn on stderr; they never stop the app.
#
# Thread count, CPU affinity and model selection are NOT set here: threads and
# affinity are derived from the detected hardware at startup, and the English
# model is chosen on first run (see Options -> English model).

[general]

# Speech/silence threshold for the VAD. Higher = shorter chunks; above the
# default it chops conversational speech into fragments.
# Range 0.0..1.0; 0 disables the VAD.
vad_threshold = 0.5

# Longest a single line gets before being force-completed, in seconds.
# Range 1..30.
vad_max_segment_duration = 12

# How often the streaming decoder re-runs on the in-progress line, in seconds.
# The dominant CPU lever. It does not change the transcript: measured on real
# speech, 44 s of audio took 69 s of wall clock at 0.5 versus 58 s at 2.0, for
# identical output. Higher = less CPU, slower on-screen updates.
# Range 0.1..5.0.
transcription_interval = 1.0
